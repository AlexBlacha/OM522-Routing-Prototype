[workspace]
name = "om522-routing-prototype"
version = "0.1.0"
description = "An explainable delivery routing prototype for OM 522, option 3"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
polars = ">=1.0,<2"
marimo = ">=0.18,<1"
matplotlib = ">=3.9,<4"

[tasks]
solve = "python -m routing.cli solve"
check = "python -m routing.cli check"
compare = "python -m routing.cli compare"
test = "python -m unittest discover -s tests -v"
app = "marimo edit app.py"
present = "marimo run app.py"
notebook-check = "marimo check app.py"
export = "marimo export html app.py -o results/prototype.html"
comparison = "python -m routing.cli compare data results/comparison"
reproduce = { depends-on = ["comparison", "export"] }
demo = "python -m routing.cli demo"
